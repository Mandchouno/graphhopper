name: PIT Guard

on:
  push:
    branches: [ "master" ]

jobs:
  pit:
    runs-on: ubuntu-latest
    env:
      MODULE: core
      TARGET_CLASSES: "com.graphhopper.reader.dem.EdgeSampling,com.graphhopper.reader.dem.HeightTile"
      DELTA_TOLERANCE: "0.50"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build core and dependencies
        run: |
          set -euxo pipefail
          mvn -q -pl "$MODULE" -am -DskipTests install

      - name: Run PIT 
        run: |
          set -euxo pipefail
          mvn -q -pl "$MODULE" \
            -DtargetClasses="$TARGET_CLASSES" \
            -Dthreads=4 \
            -DtimeoutConst=12000 \
            -DtimeoutFactor=3.0 \
            -DoutputFormats=XML,HTML \
            org.pitest:pitest-maven:mutationCoverage

          # ton script qui lit le rapport PIT et sort un nombre (ex: 82.35)
          bash scripts/pit_score.sh > mutation-score.txt

          echo "CURRENT_SCORE=$(cat mutation-score.txt)"

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: core/target/pit-reports


      - name: Download previous mutation score
        id: download-baseline
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          name: mutation-score
          workflow: pit-guard.yml
          branch: master

      - name: Compare with previous score
        id: compare
        run: |
          set -euo pipefail

          CURRENT_SCORE=$(cat mutation-score.txt)
          echo "Current mutation score: ${CURRENT_SCORE}"

          if [ -f mutation-score.txt.old ]; then
            # fichier venant de l'artifact précédent, s'il existe
            PREVIOUS_SCORE=$(cat mutation-score.txt.old)
            echo "Previous mutation score: ${PREVIOUS_SCORE}"

            TOL=${DELTA_TOLERANCE:-0.0}

            awk -v cur="$CURRENT_SCORE" -v prev="$PREVIOUS_SCORE" -v tol="$TOL" '
              BEGIN {
                diff = prev - cur;
                if (diff > tol + 1e-9) {
                  printf("Mutation score decreased beyond tolerance: %.2f -> %.2f (Δ=%.2f > tol=%.2f)\n",
                         prev, cur, diff, tol);
                  exit 1;
                } else {
                  printf("Mutation score within tolerance: %.2f -> %.2f (Δ=%.2f, tol=%.2f)\n",
                         prev, cur, diff, tol);
                  exit 0;
                }
              }'
          else
            echo "No previous baseline found. Using current score as baseline."
          fi

      - name: Prepare baseline file for artifact
        if: success()
        run: |
          # on garde le score courant pour la prochaine run
          mv mutation-score.txt mutation-score.txt.old

      - name: Save new mutation score as artifact (baseline)
        if: success() && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-score
          path: mutation-score.txt.old
